<?xml version="1.0" encoding="UTF-8"?>
<!-- Fabric 構成図（図形のみ）。判定・説明はPowerPoint側 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="f6arrowY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ca8a04"/>
    </marker>
    <marker id="f6arrowChk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .peer-fr   { fill: #fefce8; stroke: #ca8a04; stroke-width: 3; rx: 12; }
      .peer-lab  { font-size: 20px; font-weight: 700; fill: #a16207; text-anchor: middle; }
      .block     { fill: #ffffff; stroke: #ca8a04; stroke-width: 3; rx: 8; }
      .block-no  { font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .chain     { stroke: #ca8a04; stroke-width: 4; fill: none; }
      .master    { fill: #ffffff; stroke: #dc2626; stroke-width: 4; }
      .master-l  { font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .master-v  { font-size: 34px; font-weight: 800; fill: #dc2626; text-anchor: middle; font-family: 'SFMono-Regular', Menlo, monospace; }
      .cmp       { stroke: #475569; stroke-width: 4; stroke-dasharray: 8 5; fill: none; }
    </style>
  </defs>

  <!-- 3 Peers stacked (大) -->
  <g transform="translate(20, 20)">
    <!-- Peer A -->
    <rect class="peer-fr" x="0" y="0" width="520" height="76"/>
    <text class="peer-lab" x="40" y="44" transform="rotate(-90 40 44)">Peer A</text>
    <g transform="translate(80, 16)">
      <rect class="block" x="0"   y="0" width="86" height="44"/><text class="block-no" x="43" y="30">#1</text>
      <rect class="block" x="130" y="0" width="86" height="44"/><text class="block-no" x="173" y="30">#2</text>
      <rect class="block" x="260" y="0" width="86" height="44"/><text class="block-no" x="303" y="30">#3</text>
      <rect class="block" x="390" y="0" width="46" height="44"/><text class="block-no" x="413" y="30" font-size="17">#4</text>
      <line class="chain" x1="86" y1="22" x2="130" y2="22" marker-end="url(#f6arrowY)"/>
      <line class="chain" x1="216" y1="22" x2="260" y2="22" marker-end="url(#f6arrowY)"/>
      <line class="chain" x1="346" y1="22" x2="390" y2="22" marker-end="url(#f6arrowY)"/>
    </g>
  </g>
  <g transform="translate(20, 108)">
    <rect class="peer-fr" x="0" y="0" width="520" height="76"/>
    <text class="peer-lab" x="40" y="44" transform="rotate(-90 40 44)">Peer B</text>
    <g transform="translate(80, 16)">
      <rect class="block" x="0"   y="0" width="86" height="44"/><text class="block-no" x="43" y="30">#1</text>
      <rect class="block" x="130" y="0" width="86" height="44"/><text class="block-no" x="173" y="30">#2</text>
      <rect class="block" x="260" y="0" width="86" height="44"/><text class="block-no" x="303" y="30">#3</text>
      <rect class="block" x="390" y="0" width="46" height="44"/><text class="block-no" x="413" y="30" font-size="17">#4</text>
      <line class="chain" x1="86" y1="22" x2="130" y2="22" marker-end="url(#f6arrowY)"/>
      <line class="chain" x1="216" y1="22" x2="260" y2="22" marker-end="url(#f6arrowY)"/>
      <line class="chain" x1="346" y1="22" x2="390" y2="22" marker-end="url(#f6arrowY)"/>
    </g>
  </g>
  <g transform="translate(20, 196)">
    <rect class="peer-fr" x="0" y="0" width="520" height="76"/>
    <text class="peer-lab" x="40" y="44" transform="rotate(-90 40 44)">Peer C</text>
    <g transform="translate(80, 16)">
      <rect class="block" x="0"   y="0" width="86" height="44"/><text class="block-no" x="43" y="30">#1</text>
      <rect class="block" x="130" y="0" width="86" height="44"/><text class="block-no" x="173" y="30">#2</text>
      <rect class="block" x="260" y="0" width="86" height="44"/><text class="block-no" x="303" y="30">#3</text>
      <rect class="block" x="390" y="0" width="46" height="44"/><text class="block-no" x="413" y="30" font-size="17">#4</text>
      <line class="chain" x1="86" y1="22" x2="130" y2="22" marker-end="url(#f6arrowY)"/>
      <line class="chain" x1="216" y1="22" x2="260" y2="22" marker-end="url(#f6arrowY)"/>
      <line class="chain" x1="346" y1="22" x2="390" y2="22" marker-end="url(#f6arrowY)"/>
    </g>
  </g>

  <!-- Master DB (改ざん対象) -->
  <g transform="translate(60, 350)">
    <ellipse class="master" cx="100" cy="22" rx="100" ry="22"/>
    <path class="master" d="M 0 22 a 100 22 0 0 0 200 0 v 80 a 100 22 0 0 1 -200 0 z"/>
    <ellipse class="master" cx="100" cy="22" rx="100" ry="22"/>
    <text class="master-l" x="100" y="16">マスタ</text>
    <text class="master-v" x="100" y="88">100</text>
  </g>

  <!-- Compare arrow: master -> ledger -->
  <line class="cmp" x1="270" y1="380" x2="420" y2="290" marker-end="url(#f6arrowChk)"/>
</svg>
